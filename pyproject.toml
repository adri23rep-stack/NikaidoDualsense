[project]
name = "nikaido-dualsense"
version = "2.9.8.13"
description = "Centro de control DualSense propietario para Windows"
authors = [{ name = "Team Nikaido" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
