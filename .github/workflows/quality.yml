name: Calidad y seguridad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compilar fuentes
        run: python -m compileall -q main.py nikaido_version.py src gui
      - name: Pruebas
        run: python -m pytest -q
      - name: Errores críticos de Python
        run: python -m ruff check --select E9,F63,F7,F82 main.py src gui tests
      - name: Análisis estático de seguridad
        run: python -m bandit -r main.py src gui -ll
      - name: Auditoría de dependencias
        run: python -m pip_audit -r requirements-runtime.txt
